name: CI Pipeline

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run lint
        run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Upload test results
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
          retention-days: 7
      - name: Step summary
        if: matrix.node-version == 20
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Node version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.node-version }} | Passed |" >> $GITHUB_STEP_SUMMARY

  test-integration:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGUSER: testuser
      PGPASSWORD: testpass
      PGDATABASE: testdb
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run integration tests
        run: node --test tests/integration.test.js
      - name: Notify on failure
        if: failure()
        run: |
          echo "## Integration Tests FAILED" >> $GITHUB_STEP_SUMMARY
          echo "Job: test-integration" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run build
        run: npm run build

  build-and-push:
    name: Build and Push Docker image
    needs: [test, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
      - name: Step summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | linux/amd64,linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY