name: Setup App
description: Checkout + setup Node.js + npm ci

inputs:
  node-version:
    description: Node.js version
    required: true
    default: '20'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash